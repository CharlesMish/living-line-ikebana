name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Let an in-flight production deployment finish; queue only the newest follow-up.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify and build site
        env:
          LIVING_LINE_PLACE: all
        run: npm run verify

      - name: Publish the approved tap-and-drag entry
        run: |
          cp dist/arrangement-3.html dist/index.html
          cp dist/arrangement-1.html dist/drag.html
          cp dist/arrangement-3.html dist/ikebana-web-alpha-standalone.html
          node --input-type=module <<'EOF'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const files = {};
          for (const name of ['index.html', 'drag.html', 'ikebana-web-alpha-standalone.html']) {
            const bytes = await readFile(`dist/${name}`);
            files[name] = { bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          }
          await writeFile('dist/build-info.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            placement: 'tap-and-drag',
            dragOnly: 'drag.html',
            files,
          }, null, 2) + '\n');
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

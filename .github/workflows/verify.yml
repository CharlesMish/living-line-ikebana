name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify types, tests, and build
        run: npm run verify

  rendered-evidence:
    name: Rendered evidence (Chromium, assisted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked application dependencies and build
        run: |
          npm ci
          npm run build

      - name: Install isolated browser tooling
        # Tool-only dependency: neither package.json nor the application lock changes.
        run: |
          npm install --prefix "$RUNNER_TEMP/living-line-browser" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/living-line-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Capture rendered workflow evidence
        env:
          IKEBANA_RENDER_EVIDENCE: "1"
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/living-line-browser/node_modules/playwright/index.mjs
          IKEBANA_EVIDENCE_DIR: artifacts/rendered-evidence
          IKEBANA_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/browser/rendered-evidence.mjs

      - name: Upload screenshots, PNGs, and checks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rendered-evidence/
          if-no-files-found: warn
          retention-days: 14
